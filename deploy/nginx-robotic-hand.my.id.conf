# =============================================================================
# Nginx Reverse Proxy — robotic-hand.my.id
# Salin ke: /etc/nginx/sites-available/robotic-hand.my.id
# Aktifkan: sudo ln -sf /etc/nginx/sites-available/robotic-hand.my.id /etc/nginx/sites-enabled/
# SSL     : sudo certbot --nginx -d robotic-hand.my.id -d www.robotic-hand.my.id
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name robotic-hand.my.id www.robotic-hand.my.id;

    # Batas body JSON / upload ringan
    client_max_body_size 4m;

    # Header keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket Browser (/browser) & ESP32 (/esp)
    location ~ ^/(browser|esp)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Biarkan koneksi WebSocket ESP32 & browser tetap hidup tanpa putus idle
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # API & SPA (React + Express)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Streaming audio TTS (/api/tts) tanpa buffering
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
