    html, body {
      height: 100%;
      overflow: hidden;
    }
    .sim-page {
      height: calc(100vh - 64px);
      height: calc(100dvh - 64px);
      width: 100%;
      max-width: 100% !important;
      position: relative;
      overflow: hidden;
      margin: 0;
      padding: 0 !important;
    }
    .sim-page .stage {
      width: 100%;
      height: 100% !important;
      min-height: 100% !important;
      margin: 0 !important;
      border-radius: 0;
      border: none;
      background: radial-gradient(circle at 50% 50%, rgba(245, 184, 46, 0.16), transparent 65%);
    }
    .sim-hud {
      position: absolute;
      top: clamp(16px, 3vh, 28px);
      left: clamp(16px, 3.5vw, 36px);
      z-index: 3;
      pointer-events: none;
      max-width: min(520px, calc(100% - 90px));
    }
    .sim-hud .lbl {
      font-family: var(--mono, monospace);
      font-size: 13px;
      color: var(--ac);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }
    .sim-hud .lbl::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ac);
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
      flex: none;
    }
    .sim-hud h2 {
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: -.03em;
      line-height: 1.1;
      margin: 0 0 8px;
      color: var(--fg);
    }
    .sim-hud .lead {
      font-size: clamp(13px, 1.6vw, 15px);
      color: var(--mut);
      line-height: 1.45;
      margin: 0;
    }
    @media (max-width: 640px) {
      .sim-hud .lead {
        display: none;
      }
      .sim-hud h2 {
        font-size: 22px;
      }
      .sim-hud .lbl {
        font-size: 11px;
      }
    }
  </style>

<main class="sim-page">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="sim-hud">
      <div class="lbl">Simulasi</div>
      <h2>Simulasi gerakan jari</h2>
      <p class="lead">Atur jumlah jari yang terbuka. Jari lainnya menekuk dan servo menarik tali.</p>
    </div>
    <div class="cap" id="out"></div>
    <div class="dock hide" id="dock">
      <button class="tg" id="tg" aria-expanded="true" aria-label="Sembunyikan tombol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="b" style="--i:0" id="up" data-tip="Tambah jari" aria-label="Tambah jari"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="b num" style="--i:1" id="num" role="status" aria-label="Jumlah jari terbuka">5</span>
      <button class="b" style="--i:2" id="dn" data-tip="Kurangi jari" aria-label="Kurangi jari"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button class="b" style="--i:3" id="teknik" data-tip="Jari Teknik" aria-label="Jari Teknik"><span style="font-size:18px;line-height:1">🤘</span></button>
      <button class="b" style="--i:4" id="fu" data-tip="Jari Tengah" aria-label="Jari Tengah"><span style="font-size:18px;line-height:1">🖕</span></button>
      <i class="sp"></i>
      <button class="b" style="--i:5" data-v="front" data-tip="Depan" aria-label="Depan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="b" style="--i:6" data-v="back" data-tip="Belakang" aria-label="Belakang"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg></button>
      <button class="b" style="--i:7" data-v="machine" data-tip="Mesin" aria-label="Mesin"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></button>
    </div>
  </div>  
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="robot3d.js"></script>
<script>
const r = createRobot(document.getElementById('c'), { auto: true, wheel: true });
const names = ['Telunjuk', 'Tengah', 'Manis', 'Kelingking', 'Jempol'], out = document.getElementById('out'), dock = document.getElementById('dock'), tg = document.getElementById('tg');
const num = document.getElementById('num'), up = document.getElementById('up'), dn = document.getElementById('dn'), teknikBtn = document.getElementById('teknik'), fuBtn = document.getElementById('fu');
let n = 5;

// Web Audio API Synthesizer untuk suara motor servo robot
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playServoSound(dur = 0.32, pitch = 1.0) {
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc1 = ctx.createOscillator(), g1 = ctx.createGain(), f1 = ctx.createBiquadFilter();
  osc1.type = 'sawtooth';
  const f0 = (165 + Math.random() * 25) * pitch;
  osc1.frequency.setValueAtTime(f0, now);
  osc1.frequency.exponentialRampToValueAtTime(f0 * 1.3, now + dur * 0.4);
  osc1.frequency.exponentialRampToValueAtTime(f0 * 0.88, now + dur);
  f1.type = 'bandpass'; f1.frequency.setValueAtTime(820 * pitch, now); f1.Q.setValueAtTime(3.2, now);
  g1.gain.setValueAtTime(0.0001, now); g1.gain.linearRampToValueAtTime(0.16, now + 0.03);
  g1.gain.setValueAtTime(0.16, now + dur * 0.65); g1.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc1.connect(f1); f1.connect(g1); g1.connect(ctx.destination);
  osc1.start(now); osc1.stop(now + dur);

  const osc2 = ctx.createOscillator(), g2 = ctx.createGain();
  osc2.type = 'triangle';
  const whine = (1300 + Math.random() * 150) * pitch;
  osc2.frequency.setValueAtTime(whine, now);
  osc2.frequency.linearRampToValueAtTime(whine * 1.15, now + dur * 0.5);
  osc2.frequency.linearRampToValueAtTime(whine * 0.92, now + dur);
  g2.gain.setValueAtTime(0.0001, now); g2.gain.linearRampToValueAtTime(0.07, now + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.85);
  osc2.connect(g2); g2.connect(ctx.destination);
  osc2.start(now); osc2.stop(now + dur);

  try {
    const len = Math.floor(ctx.sampleRate * Math.min(dur, 0.18));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.1));
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    const nf = ctx.createBiquadFilter(), ng = ctx.createGain();
    nf.type = 'bandpass'; nf.frequency.setValueAtTime(2300, now); nf.Q.setValueAtTime(3.8, now);
    ng.gain.setValueAtTime(0.045, now); ng.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.7);
    noise.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
    noise.start(now); noise.stop(now + dur);
  } catch (e) { }
}

function playTeknikRobotSound() {
  const ctx = getAudioCtx();
  playServoSound(0.55, 1.15);
  if (ctx) {
    [350, 520, 690, 1040].forEach((freq, idx) => {
      const t = ctx.currentTime + idx * 0.075;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.15);
    });
  }
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("No teknik, no party!");
      u.rate = 0.86;
      u.pitch = 0.42;
      u.volume = 1.0;
      const vs = window.speechSynthesis.getVoices();
      const vId = vs.find(v => v.lang && (v.lang.startsWith('id') || v.lang.includes('ID')));
      if (vId) u.voice = vId;
      window.speechSynthesis.speak(u);
    } catch (e) { }
  }
}

function playFuRobotSound() {
  const ctx = getAudioCtx();
  playServoSound(0.5, 1.1);
  if (ctx) {
    [180, 140, 110].forEach((freq, idx) => {
      const t = ctx.currentTime + idx * 0.11;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.2);
    });
  }
  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("Fuck you");
      u.lang = 'en-US';
      u.rate = 0.88;
      u.pitch = 0.38;
      u.volume = 1.0;
      const vs = window.speechSynthesis.getVoices();
      const vEn = vs.find(v => v.lang && (v.lang.startsWith('en') || v.lang.includes('EN')));
      if (vEn) u.voice = vEn;
      window.speechSynthesis.speak(u);
    } catch (e) { }
  }
}

function show(v, playSound = true) {
  n = Math.max(0, Math.min(5, v));
  r.setFingers(n);
  num.textContent = n;
  up.disabled = n === 5;
  dn.disabled = n === 0;
  if (teknikBtn) teknikBtn.classList.remove('on');
  if (fuBtn) fuBtn.classList.remove('on');
  out.textContent = n ? 'Jari terbuka: ' + names.slice(0, n).join(', ') : 'Semua jari menekuk';
  if (playSound) playServoSound();
}

up.onclick = () => show(n + 1);
dn.onclick = () => show(n - 1);
if (teknikBtn) {
  teknikBtn.onclick = () => {
    r.setPose([0, 1, 1, 0, 0]);
    num.textContent = '🤘';
    teknikBtn.classList.add('on');
    if (fuBtn) fuBtn.classList.remove('on');
    up.disabled = false;
    dn.disabled = false;
    out.textContent = '🤘 Jari Teknik: No Teknik No Party!';
    playTeknikRobotSound();
  };
}
if (fuBtn) {
  fuBtn.onclick = () => {
    r.setPose([1, 0, 1, 1, 1]);
    num.textContent = '🖕';
    fuBtn.classList.add('on');
    if (teknikBtn) teknikBtn.classList.remove('on');
    up.disabled = false;
    dn.disabled = false;
    out.textContent = '🖕 Fuck You!';
    playFuRobotSound();
  };
}
dock.querySelectorAll('[data-v]').forEach(b => b.onclick = () => r.view(b.dataset.v));
tg.onclick = () => {
  const h = dock.classList.toggle('hide');
  tg.setAttribute('aria-expanded', String(!h));
  tg.setAttribute('aria-label', h ? 'Tampilkan tombol' : 'Sembunyikan tombol');
};
show(5, false);
setTimeout(() => dock.classList.remove('hide'), 250);
</script>
<script src="theme.js"></script>
</body>
